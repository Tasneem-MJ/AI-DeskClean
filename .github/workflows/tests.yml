name: AI-DeskClean Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Run tests
        run: |
          git clone "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" project
          cd project
          python3 --version
          python3 -m pip install --upgrade pip
          python3 -m pip install pytest
          python3 -m pytest -v
