<style>@font-face{font-family:'The Year of the Camel';src:local('The Year of the Camel'),local('CAMEL THE OF YEAR THE');font-display:swap}</style>
<style>
  :root{--kau-dark:#055934;--kau-primary:#208D44;--kau-lime:#86C242;--kau-light:#D3E6BE;--kau-offwhite:#F0EEE9;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'The Year of the Camel','Alexandria',sans-serif;background:#F0EEE9;overflow:hidden}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#F0EEE9}
  ::-webkit-scrollbar-thumb{background:#D3E6BE;border-radius:3px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulseGlow{0%,100%{box-shadow:0 0 10px rgba(134,194,66,.2)}50%{box-shadow:0 0 25px rgba(134,194,66,.6)}}
  .spin{animation:spin 1s linear infinite}
  .fade-in{animation:fadeIn 0.35s ease both}
  .pulse-glow{animation:pulseGlow 2s ease-in-out infinite}
  input[type=range]{-webkit-appearance:none;height:6px;border-radius:9999px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#208D44;cursor:pointer}
  .toggle{position:relative;display:inline-block;width:40px;height:22px}
  .toggle input{opacity:0;width:0;height:0}
  .slider{position:absolute;cursor:pointer;inset:0;background:#d1d5db;border-radius:9999px;transition:.3s}
  .slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:white;border-radius:50%;transition:.3s}
  input:checked+.slider{background:#208D44}
  input:checked+.slider:before{transform:translateX(18px)}
  .progress-bar{height:8px;background:#D3E6BE;border-radius:9999px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#208D44,#86C242);border-radius:9999px;transition:width .4s ease}
  .dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center}
  .dialog-box{background:white;border-radius:20px;padding:28px;max-width:440px;width:90%;border:1.5px solid #D3E6BE;box-shadow:0 20px 60px rgba(5,89,52,.2)}
  .badge{display:inline-flex;align-items:center;padding:2px 10px;border-radius:9999px;font-size:10px;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:8px;font-size:10px;font-weight:600;background:#F0EEE9;color:#208D44}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#055934;color:white;padding:10px 24px;border-radius:9999px;font-size:13px;font-weight:500;z-index:9999;pointer-events:none;animation:fadeIn .3s ease}
  table{width:100%;border-collapse:collapse}
  th{text-align:left;padding:8px 12px;font-size:10px;font-weight:700;color:#208D44;text-transform:uppercase;letter-spacing:.05em;background:#F7F6F2;border-bottom:1px solid #D3E6BE}
  td{padding:8px 12px;font-size:11px;border-bottom:1px solid #ECEFE8}
  tr:hover td{background:#f9f6fd}
  .stat-card{background:white;border-radius:16px;border:1px solid #D3E6BE;padding:14px;display:flex;flex-direction:column;gap:4px}
  .section-card{background:white;border-radius:16px;border:1px solid #D3E6BE;overflow:hidden}
  .section-title{padding:10px 20px;border-bottom:1px solid #E4EDDA;background:#F7F6F2;font-size:11px;font-weight:700;color:#208D44;text-transform:uppercase;letter-spacing:.08em}
  .setting-row{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid #ECEFE8}
  .setting-row:last-child{border-bottom:none}
  .setting-icon{width:32px;height:32px;border-radius:10px;background:#F0EEE9;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .btn-primary{background:#208D44;color:white;border:none;border-radius:12px;padding:10px 22px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
  .btn-primary:hover{background:#055934}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-outline{background:transparent;color:#208D44;border:1.5px solid #208D44;border-radius:12px;padding:9px 20px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
  .btn-outline:hover{background:#208D44;color:white}
  .btn-ghost{background:transparent;color:#66756B;border:1.5px solid #C7D9BE;border-radius:12px;padding:9px 20px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:background .2s}
  .btn-ghost:hover{background:#F0EEE9}
  .btn-danger{background:transparent;color:#dc2626;border:1.5px solid #fca5a5;border-radius:12px;padding:9px 20px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:background .2s}
  .btn-danger:hover{background:#fef2f2}
  .input-field{width:100%;padding:10px 14px;border:1.5px solid #D3E6BE;border-radius:12px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;color:#183A2A;background:white;outline:none;transition:border .2s}
  .input-field:focus{border-color:#208D44;box-shadow:0 0 0 3px rgba(32,141,68,.1)}
  .select-field{width:100%;padding:10px 14px;border:1.5px solid #D3E6BE;border-radius:12px;font-family:'The Year of the Camel','Alexandria',sans-serif;font-size:13px;color:#183A2A;background:white;outline:none;cursor:pointer}
  .nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.6);border:none;background:transparent;width:100%;font-family:'The Year of the Camel','Alexandria',sans-serif}
  .nav-item:hover{background:rgba(255,255,255,.1);color:white}
  .nav-item.active{background:#208D44;color:white}
  .card-hover{transition:all .2s;cursor:pointer}
  .card-hover:hover{border-color:#D3E6BE!important;box-shadow:0 4px 20px rgba(32,141,68,.1)}
  .action-card{background:white;border-radius:16px;border:1px solid #D3E6BE;padding:18px;display:flex;flex-direction:column;gap:12px;cursor:pointer;transition:all .2s;text-align:left}
  .action-card:hover{border-color:#D3E6BE;box-shadow:0 4px 20px rgba(32,141,68,.1)}
  /* RTL */
  [dir=rtl] th{text-align:right}
  [dir=rtl] td{text-align:right}
  [dir=rtl] .setting-row{flex-direction:row-reverse;text-align:right}
  [dir=rtl] .nav-item{flex-direction:row-reverse;text-align:right}
  [dir=rtl] .action-card{text-align:right}
  [dir=rtl] input[type=range]{direction:ltr}
</style>

/* ─── Helpers ──────────────────────────────────────────────────── */
function Toggle({checked, onChange}) {
  return (
    <label className="toggle" style={{flexShrink:0}}>
      <input type="checkbox" checked={checked} onChange={e => onChange(e.target.checked)} />
      <span className="slider" />
    </label>
  );
}
function Cb({checked, onChange, id}) {
  return (
    <input type="checkbox" id={id} checked={checked} onChange={e=>onChange(e.target.checked)}
      style={{width:17,height:17,accentColor:'#208D44',cursor:'pointer'}} />
  );
}
function StatCard({icon, label, value, sub, color='#208D44'}) {
  return (
    <div className="stat-card">
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
        <div style={{width:30,height:30,borderRadius:10,background:color+'1a',display:'flex',alignItems:'center',justifyContent:'center',color}}>{icon}</div>
        <span style={{fontSize:11,color:'#66756B',fontWeight:500,lineHeight:1.3}}>{label}</span>
      </div>
      <span style={{fontSize:22,fontWeight:800,color}}>{value}</span>
      {sub && <span style={{fontSize:10,color:'#849087'}}>{sub}</span>}
    </div>
  );
}
function ActionCard({icon, label, desc, onClick, color='#208D44'}) {
  return (
    <div className="action-card" onClick={onClick} role="button" tabIndex={0}>
      <div style={{width:40,height:40,borderRadius:12,background:color+'1a',display:'flex',alignItems:'center',justifyContent:'center',color,fontSize:20}}>{icon}</div>
      <div>
        <div style={{fontWeight:700,fontSize:13,color:'#183A2A'}}>{label}</div>
        <div style={{fontSize:11,color:'#66756B',marginTop:2}}>{desc}</div>
      </div>
    </div>
  );
}
function Progress({value}) {
  return (
    <div className="progress-bar">
      <div className="progress-fill" style={{width:`${Math.min(value,100)}%`}} />
    </div>
  );
}
function Badge({children, color='#208D44', bg=''}) {
  const bgc = bg || color+'1a';
  return <span className="badge" style={{background:bgc,color}}>{children}</span>;
}

    <div style={{width:size,height:size,borderRadius:size*0.28,background:'linear-gradient(135deg,#208D44,#86C242)',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 4px 12px rgba(32,141,68,.4)'}}>

}

/* ─── Screens that show the sidebar ────────────────────────────── */
const POST = new Set(['dashboard','folder','permission','scanning','ai_classification','summary','review','preview','confirmation','organizing','results','report','history','reports','settings','notifications','help']);

const NAV = [
  {id:'dashboard',icon:I.dashboard,key:'dashboard'},
  {id:'folder',icon:I.folder,key:'organize_files'},
  {id:'history',icon:I.history,key:'history'},
  {id:'reports',icon:I.report,key:'nav_reports'},
  {id:'settings',icon:I.settings,key:'settings'},
  {id:'help',icon:I.help,key:'help'},
];

const PIPELINE = new Set(['folder','permission','scanning','ai_classification','summary','review','preview','confirmation','organizing','results','report']);

/* ═══════════════════════════════════════════════════════════════ */
/*  MAIN APP                                                       */
/* ═══════════════════════════════════════════════════════════════ */
function App() {
  const [screen, setScreen] = useState('splash');
  const [prev, setPrev] = useState('welcome');
  const [lang, setLang] = useState('en');
  const [privOk, setPrivOk] = useState(false);
  const [folder, setFolder] = useState('');
  const [includeSubfolders, setIncludeSubfolders] = useState(true);
  const [classifyMethod, setClassifyMethod] = useState('extension');
  const [aiModel, setAiModel] = useState('gemma3');
  const [keywordRulesText, setKeywordRulesText] = useState('');
  const [maximized, setMaximized] = useState(false);
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [toast, setToast] = useState(null);
  const [settings, setSettings] = useState({ai:true});
  const [undoOpen, setUndoOpen] = useState(false);

  const [scanResult, setScanResult] = useState(null);
  const [classifyResult, setClassifyResult] = useState(null);
  const [excluded, setExcluded] = useState(() => new Set());
  const [orgResult, setOrgResult] = useState(null);
  const [history, setHistory] = useState([]);

  const t = k => (dict[lang] && dict[lang][k]) || k;
  /* Same as t(), but substitutes {n} (or any {placeholder}) in the
     translated string with values from the given object, e.g.
     tf('restored_files_msg', {n: 4}) -> "Restored 4 file(s)." */
  const tf = (k, vals) => t(k).replace(/\{(\w+)\}/g, (_, key) => (vals && vals[key] !== undefined) ? vals[key] : `{${key}}`);
  t.f = tf; // lets any screen that only received `t` still do t.f('key', {n:5})
  const isRTL = lang === 'ar';

  /* Turns the "FolderName = kw1, kw2" textarea into the rule list the
     backend expects for the keyword classification method. */
  const parseKeywordRules = (text) => {
    return (text || '')
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .map(line => {
        const [folderPart, keywordsPart] = line.split('=');
        const folder = (folderPart || '').trim();
        const keywords = (keywordsPart || '')
          .split(',')
          .map(k => k.trim())
          .filter(Boolean);
        return { folder, keywords };
      })
      .filter(rule => rule.folder && rule.keywords.length > 0);
  };

  React.useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
    document.body.dir = isRTL ? 'rtl' : 'ltr';
    document.body.style.fontFamily = isRTL
      ? "'The Year of the Camel','Alexandria',sans-serif"
      : "'Poppins','Alexandria',sans-serif";
  }, [lang, isRTL]);

  const isPost = POST.has(screen);

  const notify = msg => { setToast(msg); setTimeout(()=>setToast(null),2800); };
  const go = s => { setPrev(screen); setScreen(s); };

  /* Bridge to the Python backend, exposed by pywebview as window.pywebview.api */
  const api = (method, ...args) => {
    if (!window.pywebview || !window.pywebview.api || !window.pywebview.api[method]) {
      return Promise.reject(new Error(t('bridge_not_ready')));
    }
    return window.pywebview.api[method](...args);
  };

  const refreshHistory = () => {
    api('get_history').then(r => { if (r && r.success) setHistory(r.history || []); }).catch(()=>{});
  };

  const [dashStats, setDashStats] = useState(null);
  const [dashRecent, setDashRecent] = useState([]);
  const [canUndo, setCanUndo] = useState(false);
  const refreshDashboard = () => {
    api('get_dashboard_stats').then(r => {
      if (r && r.success) { setDashStats(r.stats || null); setDashRecent(r.recent || []); setCanUndo(!!r.can_undo); }
    }).catch(()=>{});
  };

  /* Persist the chosen language so it survives an app restart. */
  const changeLang = (l) => {
    setLang(l);
    api('save_settings', {language: l}).catch(()=>{});
  };
  React.useEffect(() => {
    api('get_settings').then(r => {
      if (r && r.success && r.settings && r.settings.language) setLang(r.settings.language);
    }).catch(()=>{});
  }, []);

  /* TopBar — this is the app's ONLY title bar. The desktop window is
     created frameless (see app.py) so there is no separate native OS
     title bar underneath it; only this element's ".pywebview-drag-region"
     class lets the user drag the window. */
  const TopBar = () => (
    <div className="pywebview-drag-region" style={{height:48,background:'#055934',display:'flex',alignItems:'center',justifyContent:'space-between',flexDirection:isRTL?'row-reverse':'row',padding:'0 12px',flexShrink:0,zIndex:50}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        {isPost && (
          <button onClick={()=>setSidebarOpen(o=>!o)} style={{width:28,height:28,borderRadius:8,background:'rgba(255,255,255,.1)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,.8)'}}>
            {I.menu}
          </button>
        )}
        <KauLogo size={38} white={true} />
        <span style={{color:'rgba(255,255,255,.5)',fontSize:12}}>|</span>
        <span style={{color:'white',fontSize:12,fontWeight:700,letterSpacing:.5}}>{t('title')}</span>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8}}>
        {isPost && <>
          <button onClick={()=>go('settings')} style={{background:'none',border:'none',cursor:'pointer',color:'rgba(255,255,255,.8)',padding:6}}>{I.settings}</button>
          <div style={{display:'flex',alignItems:'center',gap:7,background:'rgba(255,255,255,.1)',borderRadius:8,padding:'4px 10px'}}>
            <div style={{width:22,height:22,borderRadius:'50%',background:'#86C242',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,color:'#055934'}}>L</div>
            <span style={{fontSize:11,fontWeight:600,color:'white'}}>{t('local_mode')}</span>
          </div>
        </>}
        <div style={{display:'flex',gap:2,marginLeft:4}}>
          {[
            {ico:I.minus, cb:()=>{ api('minimize_window').catch(()=>{}); }},
            {ico:maximized?I.minimize:I.maximize, cb:()=>{
              const next = !maximized;
              setMaximized(next);
              api(next ? 'maximize_window' : 'restore_window').catch(()=>{});
            }},
            {ico:I.x, cb:()=>{ api('close_application').catch(()=>{}); }},
          ].map((b,i)=>(
            <button key={i} onClick={b.cb} style={{width:24,height:24,background:'rgba(255,255,255,.08)',border:'none',borderRadius:6,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,.75)'}}>{b.ico}</button>
          ))}
        </div>
      </div>
    </div>
  );

  /* Sidebar */
  const Sidebar = () => (
    <div style={{width:sidebarOpen?208:52,background:'#055934',display:'flex',flexDirection:'column',flexShrink:0,transition:'width .25s',overflow:'hidden'}}>
      <div style={{flex:1,padding:'10px 8px',display:'flex',flexDirection:'column',gap:2}}>
        {NAV.map(({id,icon,key})=>{
          const active = screen===id || (id==='folder' && PIPELINE.has(screen));
          return (
            <button key={id} onClick={()=>go(id==='history' ? (refreshHistory(),'history') : id)} className={`nav-item ${active?'active':''}`}>
              <span style={{flexShrink:0,display:'flex'}}>{icon}</span>
              {sidebarOpen && <span style={{whiteSpace:'nowrap'}}>{t(key)}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );

  const wrapStyle = {
    height: '100vh',
    display:'flex',flexDirection:'column',
    fontFamily:"'The Year of the Camel','Alexandria',sans-serif",
    background:'#F0EEE9',color:'#183A2A',
    overflow:'hidden',
  };

  return (
    <div style={wrapStyle} dir={isRTL?'rtl':'ltr'}>
      <TopBar />
      {toast && <div className="toast">{toast}</div>}
      {/* flexDirection is intentionally always 'row': the dir attribute
          above already mirrors flex layout automatically in RTL, so the
          sidebar lands on the right in Arabic without any extra flip
          here. Adding 'row-reverse' on top of dir="rtl" would cancel the
          mirroring back out, which was the bug. */}
      <div style={{flex:1,display:'flex',overflow:'hidden',flexDirection:'row'}}>
        {isPost && <Sidebar />}
        <div style={{flex:1,overflowY:'auto',overflowX:'hidden',display:'flex',flexDirection:'column',textAlign:isRTL?'right':'left'}}>
          {/* Local-only flow — no accounts, no sign-in */}
          {/* Onboarding order: language selection first, then the
              "Get Started" welcome screen, then the privacy policy
              agreement, and only then the main application. */}
          {screen==='splash'        && <SplashScreen onDone={()=>go('language')} t={t}/>}
          {screen==='language'      && <LangScreen lang={lang} setLang={changeLang} onNext={()=>go('welcome')} showBack={false} t={t}/>}
          {screen==='welcome'       && <WelcomeScreen onStart={()=>go('privacy')} onExit={()=>notify(t('exit'))} t={t}/>}
          {screen==='privacy'       && <PrivacyScreen ok={privOk} setOk={setPrivOk} onNext={()=>{refreshHistory();refreshDashboard();go('dashboard');}} onBack={()=>go('welcome')} t={t}/>}
          {/* Main application */}
          {screen==='dashboard'     && <DashboardScreen stats={dashStats} recent={dashRecent} canUndo={canUndo} refresh={refreshDashboard} onScan={()=>go('folder')} onHistory={()=>{refreshHistory();go('history');}} onReports={()=>go('reports')} onView={entry=>{setOrgResult(entry);go('report');}} onUndo={()=>setUndoOpen(true)} t={t}/>}
          {screen==='folder'        && <FolderScreen api={api} folder={folder} setFolder={setFolder} includeSubfolders={includeSubfolders} setIncludeSubfolders={setIncludeSubfolders} classifyMethod={classifyMethod} setClassifyMethod={setClassifyMethod} aiModel={aiModel} setAiModel={setAiModel} keywordRulesText={keywordRulesText} setKeywordRulesText={setKeywordRulesText} onNext={()=>go('permission')} onBack={()=>go('dashboard')} notify={notify} t={t}/>}
          {screen==='permission'    && <PermissionScreen folder={folder} includeSubfolders={includeSubfolders} onConfirm={()=>go('scanning')} onCancel={()=>go('folder')} t={t}/>}
          {screen==='scanning'      && <ScanningScreen api={api} includeSubfolders={includeSubfolders} onDone={r=>{setScanResult(r);go('ai_classification');}} onError={msg=>{notify(msg);go('folder');}} onCancel={()=>go('folder')} t={t}/>}
          {screen==='ai_classification' && <AIClassScreen api={api} useAi={false} method={classifyMethod} aiModel={aiModel} keywordRules={parseKeywordRules(keywordRulesText)} onDone={r=>{setClassifyResult(r);setExcluded(new Set());go('summary');}} onError={msg=>{notify(msg);go('dashboard');}} t={t}/>}
          {screen==='summary'       && <SummaryScreen classifyResult={classifyResult} onReview={()=>go('review')} onContinue={()=>go('preview')} onScanAgain={()=>go('scanning')} onCancel={()=>go('dashboard')} t={t}/>}
          {screen==='review'        && <ReviewScreen api={api} classifyResult={classifyResult} setClassifyResult={setClassifyResult} onContinue={()=>go('preview')} onBack={()=>go('summary')} t={t}/>}
          {screen==='preview'       && <PreviewScreen folder={folder} classifyResult={classifyResult} excluded={excluded} setExcluded={setExcluded} onOrganize={()=>go('confirmation')} onBack={()=>go('summary')} t={t}/>}
          {screen==='confirmation'  && <ConfirmScreen folder={folder} classifyResult={classifyResult} excluded={excluded} onConfirm={()=>go('organizing')} onBack={()=>go('preview')} onCancel={()=>go('dashboard')} t={t}/>}
          {screen==='organizing'    && <OrganisingScreen api={api} excluded={excluded} onDone={r=>{setOrgResult(r);refreshHistory();refreshDashboard();go('results');}} onError={msg=>{notify(msg);go('confirmation');}} t={t}/>}
          {screen==='results'       && <ResultsScreen orgResult={orgResult} onOpenFolder={()=>{api('open_folder',folder).catch(()=>notify(t('could_not_open_folder')));}} onReport={()=>go('report')} onUndo={()=>setUndoOpen(true)} onDashboard={()=>go('dashboard')} onFinish={()=>go('dashboard')} t={t}/>}
          {screen==='report'        && <ReportScreen report={orgResult} folder={folder} onBack={()=>go('results')} onDashboard={()=>go('dashboard')} t={t}/>}
          {screen==='history'       && <HistoryScreen api={api} history={history} refresh={refreshHistory} onView={entry=>{setOrgResult(entry);go('report');}} notify={notify} t={t}/>}
          {screen==='reports'       && <ReportsScreen api={api} t={t}/>}
          {screen==='settings'      && <SettingsScreen settings={settings} setSettings={setSettings} lang={lang} setLang={changeLang} onBack={()=>go(prev)} t={t}/>}
          {screen==='notifications' && <NotificationsScreen t={t}/>}
          {screen==='help'          && <HelpScreen t={t}/>}
        </div>
      </div>

      {/* Undo dialog */}
      {undoOpen && (
        <div className="dialog-overlay" onClick={()=>setUndoOpen(false)}>
          <div className="dialog-box" onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
              <span style={{color:'#d97706',display:'flex'}}>{I.warn}</span>
              <strong style={{color:'#055934',fontSize:16}}>{t('undo')}</strong>
            </div>
            <p style={{color:'#5F6D63',fontSize:13,marginBottom:20,lineHeight:1.6}}>{t('undo_confirm_text')}</p>
            <div style={{display:'flex',gap:10,justifyContent:'flex-end'}}>
              <button className="btn-outline" onClick={()=>setUndoOpen(false)}>{t('cancel')}</button>
              <button className="btn-primary" style={{background:'#dc2626'}} onClick={()=>{
                setUndoOpen(false);
                api('undo_last_operation').then(r=>{
                  notify(r && r.success ? tf('restored_files_msg', {n: r.restored_count}) : t('undo_failed_msg'));
                  refreshHistory();
                  refreshDashboard();
                  go('dashboard');
                }).catch(()=>{notify(t('undo_failed_msg'));go('dashboard');});
              }}>{t('confirm_undo_btn')}</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
/* ═══════════════════ SCREENS ═══════════════════════════════════ */

/* 1 — SPLASH */
function SplashScreen({onDone,t}) {
  const [p,setP]=useState(0);
  useEffect(()=>{
    const iv=setInterval(()=>setP(x=>{if(x>=100){clearInterval(iv);return 100;}return x+2;}),40);
    const tm=setTimeout(onDone,2500);
    return()=>{clearInterval(iv);clearTimeout(tm);};
  },[]);
  return (
    <div className="fade-in" style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',background:'#055934'}}>
      <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:24}}>
        <div className="pulse-glow" style={{borderRadius:24,padding:4}}><AppLogo size={88}/></div>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:28,fontWeight:800,color:'white',marginBottom:4}}>{t('title')}</div>
          <div style={{fontSize:13,color:'#D3E6BE'}}>{t('subtitle')}</div>
        </div>
        <div style={{width:240}}>
          <Progress value={p}/>
          <div style={{display:'flex',justifyContent:'space-between',marginTop:6,fontSize:10,color:'#86C242'}}>
            <span>{t('loading_system')}</span><span>{p}%</span>
          </div>
        </div>
        <div style={{marginTop:16,opacity:.55}}><KauLogo size={54} white={true}/></div>
      </div>
    </div>
  );
}

/* 2 — WELCOME */
function WelcomeScreen({onStart,onExit,t}) {
  return (
    <div className="fade-in" style={{flex:1,display:'flex',flexDirection:'column',background:'#F0EEE9',position:'relative'}}>
      <div style={{position:'absolute',top:20,left:24}}><KauLogo size={60}/></div>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32,textAlign:'center'}}>
        <AppLogo size={72}/>
        <h2 style={{fontSize:28,fontWeight:800,color:'#055934',margin:'20px 0 12px'}}>{t('welcome_title')}</h2>
        <p style={{color:'#5F6D63',maxWidth:480,lineHeight:1.7,marginBottom:36,fontSize:14}}>{t('welcome_desc')}</p>
        <div style={{display:'flex',gap:14}}>
          <button className="btn-ghost" onClick={onExit} style={{width:120}}>{t('exit')}</button>
          <button className="btn-primary" onClick={onStart} style={{width:160,fontSize:14}}>{t('get_started')} →</button>

/* 3 — LANGUAGE */
function LangScreen({lang,setLang,onNext,onBack,showBack=true,t}) {
  return (
    <div className="fade-in" style={{flex:1,display:'flex',flexDirection:'column',background:'#F0EEE9'}}>
      <div style={{padding:'20px 24px 8px',minHeight:38}}>
        {showBack && <button className="btn-ghost" onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,padding:'6px 12px'}}>{I.back}{t('back')}</button>}
      </div>
      <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:32}}>

        <div style={{display:'flex',gap:20,marginBottom:36,width:'100%',maxWidth:400}}>
          {[['en','🇺🇸','English'],['ar','🇸🇦','العربية']].map(([l,flag,label])=>(
            <div key={l} onClick={()=>setLang(l)}

            >

/* 4 — PRIVACY */
function PrivacyScreen({ok,setOk,onNext,onBack,t}) {
  const pts=[
    [I.cpu,t('priv_local_title'),t('priv_local_desc')],
    [I.wifi0,t('priv_nocloud_title'),t('priv_nocloud_desc')],
    [I.folder,t('priv_folder_title'),t('priv_folder_desc')],
    [I.shield,t('priv_sysfile_title'),t('priv_sysfile_desc')],
    [I.db,t('priv_data_title'),t('priv_data_desc')],

      <h2 style={{fontSize:22,fontWeight:800,color:'#055934',marginBottom:4}}>{t('privacy_title')}</h2>
      <p style={{color:'#5F6D63',fontSize:13,marginBottom:20}}>{t('privacy_subtitle')}</p>

        {pts.map(([icon,title,desc],i)=>(
          <div key={i} style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:'14px 16px',display:'flex',gap:14,alignItems:'flex-start'}}>

            <div><div style={{fontWeight:700,fontSize:13,color:'#183A2A',marginBottom:4}}>{title}</div><div style={{fontSize:12,color:'#66756B',lineHeight:1.5}}>{desc}</div></div>

      <div style={{display:'flex',gap:10}}>
        <button className="btn-ghost" onClick={onBack}>{t('cancel')}</button>

      </div>

}

/* 10 — DASHBOARD */
function DashboardScreen({stats,recent,canUndo,refresh,onScan,onHistory,onReports,onView,onUndo,t}) {
  useEffect(()=>{ refresh && refresh(); }, []);
  const s = stats || {files_organized:0,operations:0,categories:0,undone:0,last_run:null};
  const lastRun = s.last_run ? new Date(s.last_run).toLocaleString() : t('no_activity');
  return (
    <div className="fade-in" style={{flex:1,padding:24,display:'flex',flexDirection:'column',gap:20,background:'#F0EEE9'}}>
      <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <h1 style={{fontSize:22,fontWeight:800,color:'#055934'}}>{t('welcome_back')} 👋</h1>
          <p style={{fontSize:13,color:'#5F6D63',marginTop:4}}>{t('ready')}</p>
        </div>
        {/* "Undo Last Operation" is intentionally always visible here on
            the dashboard itself, not tucked away inside History. */}
        <button
          className="btn-outline"
          disabled={!canUndo}
          onClick={onUndo}
          style={{display:'flex',alignItems:'center',gap:8,opacity:canUndo?1:.45,cursor:canUndo?'pointer':'not-allowed',borderColor:'#dc2626',color:'#dc2626'}}
        >
          {I.undo}{t('undo')}
        </button>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:14}}>
        <StatCard icon={I.check} label={t('stat_files_organized')} value={s.files_organized} color="#208D44"/>
        <StatCard icon={I.layers} label={t('stat_operations')} value={s.operations} color="#d97706"/>
        <StatCard icon={I.folder} label={t('stat_categories')} value={s.categories} color="#2563eb"/>
        <StatCard icon={I.history} label={t('stat_last_run')} value={s.last_run ? lastRun : '—'} sub={s.last_run ? '' : t('no_activity')} color="#6d28d9"/>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14}}>
        <ActionCard icon={I.zap} label={t('start_scan')} desc={t('action_scan_desc')} onClick={onScan} color="#208D44"/>
        <ActionCard icon={I.history} label={t('org_history')} desc={t('action_history_desc')} onClick={onHistory} color="#d97706"/>
      </div>

      {/* "Recent Activities" is also always visible here, right on the
          dashboard, showing the last 5 organize operations. */}
      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',overflow:'hidden'}}>
        <div className="section-title" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>{t('recent_activities')}</span>
          {recent && recent.length>0 && <button onClick={onHistory} style={{background:'none',border:'none',color:'#208D44',fontSize:11,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>{t('view_all')}</button>}
        </div>
        <div style={{padding: (recent&&recent.length) ? '8px 20px' : '24px 20px'}}>
          {(!recent || recent.length===0) && (
            <p style={{fontSize:12,color:'#849087',textAlign:'center',padding:'12px 0'}}>{t('no_activity_desc')}</p>
          )}
          {recent && recent.map((h,i)=>(
            <div key={h.id||i} onClick={()=>onView(h)} className="card-hover" style={{display:'flex',alignItems:'center',gap:12,padding:'10px 0',borderBottom:i<recent.length-1?'1px solid #ECEFE8':'none',cursor:'pointer'}}>
              <div style={{width:32,height:32,background:'rgba(32,141,68,.1)',borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',color:'#208D44',flexShrink:0}}>{I.history}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:12,color:'#183A2A',wordBreak:'break-all'}}>{h.folder}</div>
                <div style={{fontSize:10.5,color:'#849087'}}>{h.timestamp ? new Date(h.timestamp*1000).toLocaleString() : ''}</div>
              </div>
              <span style={{fontSize:11,color:'#5F6D63',flexShrink:0}}>✓ {h.moved_count||0}</span>
              {h.undone && <Badge color="#849087">{t('undone_badge')}</Badge>}
            </div>
          ))}
        </div>
      </div>

      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:20}}>
        <div style={{fontWeight:700,color:'#055934',fontSize:14,marginBottom:16,display:'flex',alignItems:'center',gap:8}}>{I.brain} {t('ai_status_title')}</div>
        <p style={{fontSize:12,color:'#5F6D63',lineHeight:1.7}}>{t('ai_status_desc')}</p>
        <div style={{marginTop:14,padding:12,background:'#F0EEE9',borderRadius:12,fontSize:11,color:'#66756B'}}>{t('local_only_notice')}</div>
      </div>
    </div>
  );
}
/* 11 — FOLDER */
function FolderScreen({api,folder,setFolder,includeSubfolders,setIncludeSubfolders,classifyMethod,setClassifyMethod,aiModel,setAiModel,keywordRulesText,setKeywordRulesText,onNext,onBack,notify,t}) {
  const [busy,setBusy] = useState(false);
  const [aiModels,setAiModels] = useState({});
  useEffect(()=>{
    api('get_ai_models').then(r=>{ if (r && r.success) setAiModels(r.models || {}); }).catch(()=>{});
  }, []);
  const choose = () => {
    setBusy(true);
    api('choose_folder').then(r=>{
      setBusy(false);
      if (r && r.success) setFolder(r.path);
      else notify(t('folder_not_usable'));
    }).catch(()=>{setBusy(false);notify(t('could_not_open_folder_picker'));});
  };
  const methods = [
    {id:'extension', icon:I.layers, label:t('method_extension'), desc:t('method_extension_d')},
    {id:'ai',        icon:I.brain,  label:t('method_ai'),        desc:t('method_ai_d')},
    {id:'keywords',  icon:I.search, label:t('method_keywords'),  desc:t('method_keywords_d')},
    {id:'age',       icon:I.history,label:t('method_age'),       desc:t('method_age_d')},
  ];
  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:680,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <button className="btn-ghost" onClick={onBack} style={{display:'flex',alignItems:'center',gap:6,fontSize:12,padding:'6px 12px',marginBottom:20}}>{I.back}{t('back_dashboard')}</button>
      <h2 style={{fontSize:22,fontWeight:800,color:'#055934',marginBottom:6}}>{t('folder_title')}</h2>
      <p style={{fontSize:13,color:'#5F6D63',marginBottom:20}}>{t('folder_desc')}</p>

      <div onClick={choose} className="card-hover" style={{background:'white',borderRadius:14,border:`2px dashed ${folder?'#208D44':'#D3E6BE'}`,padding:'22px 18px',display:'flex',alignItems:'center',gap:14,cursor:'pointer',marginBottom:20}}>
        <div style={{width:42,height:42,borderRadius:12,background:'#F0EEE9',display:'flex',alignItems:'center',justifyContent:'center',color:'#208D44'}}>{I.plus}</div>
        <div style={{flex:1,minWidth:0}}>
          {folder ? (
            <>
              <div style={{fontWeight:700,fontSize:13,color:'#183A2A',wordBreak:'break-all'}}>{folder}</div>
              <div style={{fontSize:11,color:'#849087',marginTop:3}}>{t('click_choose_different')}</div>
            </>
          ) : (
            <div style={{fontSize:13,color:'#208D44',fontWeight:600}}>{busy ? t('opening_folder_picker') : t('click_choose_folder')}</div>
          )}
        </div>
        {folder && <span style={{color:'#208D44',fontSize:18}}>✓</span>}
      </div>

      <div style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:18,marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:700,color:'#208D44',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:14}}>{t('scan_options_title')}</div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <Toggle checked={includeSubfolders} onChange={setIncludeSubfolders}/>
          <span style={{fontSize:13,color:'#183A2A'}}>{t('include_subfolders')}</span>
        </div>
        <p style={{fontSize:11,color:'#849087',marginTop:10}}>{t('hidden_files_note')}</p>
      </div>

      <div style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:18,marginBottom:20}}>
        <div style={{fontSize:11,fontWeight:700,color:'#208D44',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:14}}>{t('classify_method_title')}</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10}}>
          {methods.map(m=>(
            <button key={m.id} onClick={()=>setClassifyMethod(m.id)}
              style={{display:'flex',flexDirection:'column',gap:6,padding:'12px 14px',borderRadius:12,cursor:'pointer',
                border:`1.5px solid ${classifyMethod===m.id?'#208D44':'#D3E6BE'}`,
                background:classifyMethod===m.id?'rgba(32,141,68,.08)':'white'}}>
              <div style={{display:'flex',alignItems:'center',gap:8,color:classifyMethod===m.id?'#208D44':'#5F6D63'}}>
                {m.icon}<span style={{fontSize:12,fontWeight:700,color:'#183A2A'}}>{m.label}</span>
              </div>
              <span style={{fontSize:10.5,color:'#849087',lineHeight:1.4}}>{m.desc}</span>
            </button>
          ))}
        </div>

        {classifyMethod==='ai' && (
          <div style={{marginTop:14}}>
            <label style={{fontSize:11,fontWeight:700,color:'#208D44',textTransform:'uppercase',letterSpacing:'.06em'}}>{t('ai_model_label')}</label>
            <select className="select-field" style={{marginTop:8}} value={aiModel} onChange={e=>setAiModel(e.target.value)}>
              {Object.entries(aiModels).length===0 && <option value={aiModel}>{aiModel}</option>}
              {Object.entries(aiModels).map(([label,value])=>(
                <option key={value} value={value}>{label}</option>
              ))}
            </select>
          </div>
        )}

/* 14 — AI CLASSIFICATION */
function AIClassScreen({api,useAi,method,aiModel,keywordRules,onDone,onError,t}) {
  const [processed,setProcessed] = useState(0);
  const [total,setTotal] = useState(0);
  const [currentName,setCurrentName] = useState('');

  useEffect(()=>{
    let cancelled = false;
    const resolvedMethod = (useAi ? 'ai' : (method || 'extension'));
    const batchSize = resolvedMethod === 'ai' ? 1 : 20;

    async function run() {
      const start = await api('classify_files_start', useAi, method || 'extension', aiModel, keywordRules || []).catch(err=>{
        throw err;
      });

      if (cancelled) return;

      if (!start || !start.success) {
        onError(t('classification_failed'));
        return;
      }

      setTotal(start.total || 0);

      if (!start.total) {
        onDone({success:true, results:[], count:0, duplicate_count:0});
        return;
      }

      // eslint-disable-next-line no-constant-condition
      while (!cancelled) {
        const batch = await api('classify_files_batch', batchSize);

        if (cancelled) return;

        if (!batch || !batch.success) {
          onError(t('classification_failed'));
          return;
        }

        setProcessed(batch.processed || 0);
        const lastResult = batch.results && batch.results.length
          ? batch.results[batch.results.length - 1]
          : null;
        if (lastResult) setCurrentName(lastResult.name || '');

        if (batch.done) {
          onDone({
            success: true,
            results: batch.all_results || [],
            count: (batch.all_results || []).length,
            duplicate_count: batch.duplicate_count || 0,
          });
          return;
        }
      }
    }

    run().catch(err=>{ if (!cancelled) onError(t('classification_failed')); });
    return () => { cancelled = true; };
  }, []);

  const pct = total > 0 ? Math.min(100, Math.round((processed/total)*100)) : 0;

  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:640,margin:'0 auto',width:'100%',background:'#F0EEE9',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16}}>
      <div style={{position:'relative',width:80,height:80}}>
        <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid #D3E6BE'}}/>
        <div style={{position:'absolute',inset:0,borderRadius:'50%',border:'4px solid #86C242',borderTopColor:'transparent',animation:'spin 0.8s linear infinite'}}/>
        <div style={{position:'absolute',inset:8,borderRadius:'50%',background:'rgba(32,141,68,.08)',display:'flex',alignItems:'center',justifyContent:'center',color:'#208D44'}}>{I.brain}</div>
      </div>
      <h2 style={{fontSize:20,fontWeight:800,color:'#055934'}}>{t('ai_title')}</h2>
      <p style={{fontSize:12,color:'#5F6D63',maxWidth:400,textAlign:'center',lineHeight:1.6}}>{t('ai_desc')}</p>

      <div style={{width:'100%',maxWidth:360}}>
        <div className="progress-bar">
          <div className="progress-fill" style={{width:`${pct}%`}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:8,fontSize:11,color:'#5F6D63'}}>
          <span>{processed} / {total} {t('files') || 'files'}</span>
          <span style={{fontWeight:700,color:'#208D44'}}>{pct}%</span>
        </div>
        {currentName && (
          <div style={{marginTop:6,fontSize:11,color:'#849087',textAlign:'center',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>
            {currentName}
          </div>
        )}

  );

        {[['✅ '+t('result_organized_label'),moved,'#16a34a'],['⚠ '+t('result_errors_label'),errors,errors>0?'#dc2626':'#6b7280'],['⏱ '+t('result_time_label'),timeTaken,'#0d9488']].map(([lbl,val,col])=>(
          <div key={lbl} style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:14,textAlign:'center'}}>
            <div style={{fontSize:20,fontWeight:800,color:col}}>{val}</div>
            <div style={{fontSize:10,color:'#849087',marginTop:3,lineHeight:1.3}}>{lbl}</div>
          </div>
        ))}
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
        <button className="btn-ghost" onClick={onOpenFolder}>📂 {t('open_folder')}</button>
        <button className="btn-ghost" onClick={onReport}>{I.report} {t('view_report')}</button>
        <button className="btn-danger" onClick={onUndo}>{I.undo} {t('undo')}</button>
        <button className="btn-outline" onClick={onDashboard}>🏠 {t('dashboard_btn')}</button>
        <button className="btn-primary" style={{flex:1,height:42}} onClick={onFinish}>{t('finish')}</button>
      </div>
    </div>
  );
}
/* 21 — REPORT */
function ReportScreen({report,folder,onBack,onDashboard,t}) {
  const [filter,setFilter] = useState('All');
  const ops = (report && report.operations) || [];
  const errs = (report && report.errors) || [];
  const rows = [
    ...ops.map(o => ({name:o.file_name || (o.new_path||'').split(/[\\/]/).pop(), orig:o.original_path, dest:o.new_path, status:'Success'})),
    ...errs.map(e => ({name:(e.path||'').split(/[\\/]/).pop(), orig:e.path, dest:'—', status:'Failed', reason:e.error})),
  ];
  const shown = filter==='All' ? rows : rows.filter(r=>r.status===filter);
  const when = report && report.timestamp ? new Date(report.timestamp*1000).toLocaleString() : '';
  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:1000,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <div style={{marginBottom:16}}>
        <h2 style={{fontSize:20,fontWeight:800,color:'#055934'}}>{t('report_title')}</h2>
        {when && <p style={{fontSize:11,color:'#849087',marginTop:3}}>{when}</p>}
      </div>
      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:18,marginBottom:14}}>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:14}}>
          {[[t('report_folder_label'),(report&&report.folder)||folder],[t('report_files_moved_label'),(report&&report.moved_count)||0],[t('report_errors_label'),(report&&report.error_count)||0]].map(([k,v])=>(
            <div key={k}><div style={{fontSize:10,color:'#849087',marginBottom:2}}>{k}</div><div style={{fontSize:12,fontWeight:700,color:'#183A2A',wordBreak:'break-all'}}>{v}</div></div>
          ))}
        </div>
      </div>
      <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
        {[['All',t('filter_all')],['Success',t('filter_success')],['Failed',t('filter_failed')]].map(([f,lbl])=>(
          <button key={f} onClick={()=>setFilter(f)} style={{padding:'5px 12px',borderRadius:8,fontSize:11,fontWeight:700,border:'1.5px solid',fontFamily:'inherit',cursor:'pointer',background:filter===f?'#208D44':'white',color:filter===f?'white':'#5F6D63',borderColor:filter===f?'#208D44':'#D3E6BE'}}>{lbl}</button>
        ))}
      </div>
      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',overflow:'hidden',marginBottom:16,maxHeight:420,overflowY:'auto'}}>
        <table>
          <thead><tr>{[t('col_file_name'),t('col_original_path'),t('col_destination_reason'),t('col_status')].map(h=><th key={h}>{h}</th>)}</tr></thead>
          <tbody>
            {shown.map((r,i)=>(
              <tr key={i}>
                <td style={{fontFamily:'monospace',fontSize:11}}>{r.name}</td>
                <td style={{color:'#849087',fontSize:10,wordBreak:'break-all'}}>{r.orig}</td>
                <td style={{color:'#849087',fontSize:10,wordBreak:'break-all'}}>{r.status==='Failed'?r.reason:r.dest}</td>
                <td><span className="badge" style={{background:r.status==='Success'?'#dcfce7':'#fee2e2',color:r.status==='Success'?'#166534':'#991b1b',fontSize:10}}>{r.status==='Success'?t('status_success'):t('status_failed')}</span></td>
              </tr>
            ))}
            {shown.length===0 && <tr><td colSpan={4} style={{textAlign:'center',color:'#849087'}}>{t('no_records')}</td></tr>}
          </tbody>
        </table>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:10}}>
        <button className="btn-outline" onClick={onBack}>{t('back_to_results')}</button>
        <button className="btn-primary" style={{flex:1,height:42}} onClick={onDashboard}>🏠 {t('dashboard_btn')}</button>
      </div>
    </div>
  );
}
/* 22 — HISTORY */
function HistoryScreen({api,history,refresh,onView,notify,t}) {
  useEffect(()=>{ refresh(); }, []);
  const restore = id => {
    api('restore_from_history', id).then(r=>{
      if (r && r.success) { notify(t.f('restored_files_msg', {n: r.restored_count})); refresh(); }
      else { notify(t('restore_failed_msg')); }
    }).catch(()=>notify(t('restore_failed_msg')));
  };
  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:860,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <h2 style={{fontSize:20,fontWeight:800,color:'#055934',marginBottom:20}}>{t('history_title')}</h2>
      {history.length===0 && <p style={{fontSize:13,color:'#849087'}}>{t('no_activity_desc')}</p>}
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {[...history].reverse().map((h,i)=>(
          <div key={h.id||i} style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:'18px 20px'}}>
            <div style={{display:'flex',alignItems:'flex-start',gap:14,flexWrap:'wrap'}}>
              <div style={{width:42,height:42,background:'rgba(32,141,68,.1)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',color:'#208D44',flexShrink:0}}>{I.history}</div>
              <div style={{flex:1,minWidth:200}}>
                <div style={{fontWeight:700,fontSize:14,color:'#183A2A',wordBreak:'break-all'}}>{h.folder}</div>
                <div style={{fontSize:11,color:'#849087',marginTop:2}}>{h.timestamp ? new Date(h.timestamp*1000).toLocaleString() : ''}</div>
                <div style={{display:'flex',gap:16,marginTop:8,fontSize:11,color:'#5F6D63'}}>
                  <span>✓ {h.moved_count||0} {t('history_organized_suffix')}</span>
                  {h.error_count>0 && <span>⚠ {h.error_count} {t('history_errors_suffix')}</span>}
                </div>
              </div>
              <div style={{display:'flex',gap:8,flexShrink:0}}>
                <button className="btn-outline" style={{fontSize:11,padding:'5px 12px',height:'auto'}} onClick={()=>onView(h)}>{t('view_report_btn')}</button>
                <button style={{background:'#fffbeb',border:'1.5px solid #f59e0b',color:'#92400e',borderRadius:8,fontSize:11,padding:'5px 12px',cursor:'pointer',fontFamily:'inherit',fontWeight:600}} onClick={()=>restore(h.id)}>{t('restore_btn')}</button>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
/* 23 — SETTINGS */
function SettingsScreen({settings,setSettings,lang,setLang,onBack,t}) {
  const tgl=k=>setSettings(s=>({...s,[k]:!s[k]}));
  return (
    <div className="fade-in" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',background:'#F0EEE9'}}>
      <div style={{background:'#055934',padding:'0 20px',height:56,display:'flex',alignItems:'center',gap:14,flexShrink:0}}>
        <button onClick={onBack} style={{width:32,height:32,borderRadius:'50%',background:'rgba(255,255,255,.1)',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'white'}}>{I.back}</button>
        <div><div style={{color:'white',fontWeight:700,fontSize:14}}>{t('settings')}</div><div style={{color:'#D3E6BE',fontSize:11}}>{t('settings_subtitle')}</div></div>
      </div>
      <div style={{flex:1,overflowY:'auto',padding:24}}>
        <div style={{maxWidth:800,margin:'0 auto',display:'flex',flexDirection:'column',gap:18}}>
          <div className="section-card">
            <div className="section-title">{t('general')}</div>
            <div className="setting-row">
              <div className="setting-icon">🌐</div>
              <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:'#183A2A'}}>{t('language_label')}</div><div style={{fontSize:11,color:'#66756B',marginTop:2}}>{t('language_desc')}</div></div>
              <div style={{display:'flex',background:'#F0EEE9',borderRadius:10,padding:4,border:'1px solid #D3E6BE',gap:4}}>
                {[['en','English'],['ar','العربية']].map(([l,lbl])=>(
                  <button key={l} onClick={()=>setLang(l)} style={{padding:'5px 14px',borderRadius:7,fontSize:11,fontWeight:700,border:'none',fontFamily:'inherit',cursor:'pointer',background:lang===l?'#208D44':'transparent',color:lang===l?'white':'#5F6D63'}}>{lbl}</button>
                ))}
              </div>
            </div>
          </div>

          <div className="section-card">
            <div className="section-title">{t('ai_settings')}</div>
            <div className="setting-row"><div className="setting-icon">🧠</div><div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:'#183A2A'}}>{t('ai_classification_label')}</div><div style={{fontSize:11,color:'#66756B'}}>{t('ai_classification_desc')}</div></div><Toggle checked={settings.ai} onChange={()=>tgl('ai')}/></div>
          </div>

          <div className="section-card">
            <div className="section-title">{t('file_safety')}</div>
            <div className="setting-row"><div className="setting-icon">🛡</div><div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:'#183A2A'}}>{t('system_hidden_files_label')}</div><div style={{fontSize:11,color:'#66756B'}}>{t('system_hidden_files_desc')}</div></div></div>
            <div className="setting-row"><div className="setting-icon">↩</div><div style={{flex:1}}><div style={{fontWeight:700,fontSize:13,color:'#183A2A'}}>{t('undo_label')}</div><div style={{fontSize:11,color:'#66756B'}}>{t('undo_desc')}</div></div></div>
          </div>

          <div style={{display:'flex',justifyContent:'flex-end',gap:12,paddingBottom:24}}>
            <button className="btn-primary" style={{padding:'10px 36px'}} onClick={onBack}>{t('save_changes')}</button>
          </div>
        </div>
      </div>
    </div>
  );
}
/* 24 — NOTIFICATIONS */
function NotificationsScreen({t}) {
  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:640,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <h2 style={{fontSize:20,fontWeight:800,color:'#055934',marginBottom:20}}>{t('notifications_title')}</h2>
      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:40,textAlign:'center',color:'#849087',fontSize:13}}>
        {t('no_notifications')}
      </div>
    </div>
  );
}
/* 25 — HELP */
function HelpScreen({t}) {
  const [open,setOpen]=useState(null);
  const sections=[
    ['how',t('help_how_title'),t('help_how_body')],
    ['permission',t('help_permission_title'),t('help_permission_body')],
    ['ai',t('help_ai_title'),t('help_ai_body')],
    ['preview',t('help_preview_title'),t('help_preview_body')],
    ['undo',t('help_undo_title'),t('help_undo_body')],
    ['reports',t('help_reports_title'),t('help_reports_body')],
    ['privacy',t('help_privacy_title'),t('help_privacy_body')],
    ['faq',t('help_faq_title'),t('help_faq_body')],
  ];
  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:760,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <h2 style={{fontSize:20,fontWeight:800,color:'#055934',marginBottom:20}}>{t('help_title')}</h2>
      <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
        {sections.map(([id,title,content])=>(
          <div key={id} style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',overflow:'hidden'}}>
            <button onClick={()=>setOpen(open===id?null:id)} style={{width:'100%',display:'flex',justifyContent:'space-between',alignItems:'center',padding:'14px 18px',fontSize:13,fontWeight:700,color:'#183A2A',background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',textAlign:'left'}}>
              <span>{title}</span>
              <span style={{color:'#849087',fontSize:18}}>{open===id?'▲':'▼'}</span>
            </button>
            {open===id && <div style={{padding:'0 18px 16px',fontSize:12,color:'#5F6D63',lineHeight:1.7,borderTop:'1px solid #ECEFE8',paddingTop:12,whiteSpace:'pre-line'}}>{content}</div>}
          </div>
        ))}
      </div>
      <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:24}}>
        <div style={{fontWeight:700,color:'#055934',fontSize:15,marginBottom:16,display:'flex',alignItems:'center',gap:8}}>{I.info} {t('about_title')}</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[[t('about_system_name'),'AI-DeskClean'],[t('about_version'),'1.0.0'],[t('about_processing'),t('about_processing_v')],[t('about_ai_engine'),t('about_ai_engine_v')],[t('about_database'),t('about_database_v')],[t('about_language'),t('about_language_v')],[t('about_university'),t('about_university_v')],[t('about_faculty'),t('about_faculty_v')]].map(([k,v])=>(
            <div key={k} style={{background:'#F0EEE9',borderRadius:12,padding:12}}>
              <div style={{fontSize:10,color:'#849087',marginBottom:2}}>{k}</div>
              <div style={{fontSize:12,fontWeight:700,color:'#183A2A'}}>{v}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* 26 — REPORTS (cumulative, across every organize operation ever run) */
function ReportsScreen({api,t}) {
  const [report,setReport] = useState(null);
  const [loading,setLoading] = useState(true);
  useEffect(()=>{
    let cancelled = false;
    api('get_reports').then(r=>{
      if (cancelled) return;
      setReport(r && r.success ? r.report : null);
      setLoading(false);
    }).catch(()=>{ if(!cancelled){ setReport(null); setLoading(false); } });
    return () => { cancelled = true; };
  }, []);

  const METHOD_LABEL_KEYS = {extension:'method_extension', ai:'method_ai', keywords:'method_keywords', age:'method_age', manual:'method_manual'};
  const methodLabel = m => t(METHOD_LABEL_KEYS[m] || 'method_manual');

  const hasData = report && report.has_data;

  return (
    <div className="fade-in" style={{flex:1,padding:24,maxWidth:1000,margin:'0 auto',width:'100%',background:'#F0EEE9'}}>
      <div style={{marginBottom:20}}>
        <h2 style={{fontSize:20,fontWeight:800,color:'#055934'}}>{t('reports_title')}</h2>
        <p style={{fontSize:12,color:'#5F6D63',marginTop:3}}>{t('reports_sub')}</p>
      </div>

      {!loading && !hasData && (
        <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:40,textAlign:'center',color:'#849087',fontSize:13}}>
          {t('reports_empty')}
        </div>
      )}

      {!loading && hasData && (
        <>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14,marginBottom:18}}>
            <div style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:16,textAlign:'center'}}>
              <div style={{fontSize:24,fontWeight:800,color:'#208D44'}}>{report.total_files}</div>
              <div style={{fontSize:11,color:'#849087',marginTop:3}}>{t('reports_total_files')}</div>
            </div>
            <div style={{background:'white',borderRadius:14,border:'1px solid #D3E6BE',padding:16,textAlign:'center'}}>
              <div style={{fontSize:24,fontWeight:800,color:'#d97706'}}>{report.total_operations}</div>
              <div style={{fontSize:11,color:'#849087',marginTop:3}}>{t('reports_total_operations')}</div>
            </div>
          </div>

          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:14}}>
            <ReportPanel title={t('reports_by_category')} rows={report.by_category.map(r=>({name:r.name, value:r.count}))}/>
            <ReportPanel title={t('reports_by_method')} rows={report.by_method.map(r=>({name:methodLabel(r.method), value:r.count}))}/>
          </div>
        </>
      )}
    </div>
  );
}
function ReportPanel({title,rows}) {
  const maxValue = Math.max(1, ...rows.map(r=>r.value));
  return (
    <div style={{background:'white',borderRadius:16,border:'1px solid #D3E6BE',padding:20}}>
      <div style={{fontSize:13,fontWeight:800,color:'#183A2A',marginBottom:14}}>{title}</div>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {rows.map(r=>(
          <div key={r.name}>
            <div style={{display:'flex',justifyContent:'space-between',fontSize:12,marginBottom:5}}>
              <span style={{color:'#5F6D63',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',maxWidth:'70%'}}>{r.name}</span>
              <span style={{fontWeight:700,color:'#208D44'}}>{r.value}</span>
            </div>
            <div style={{height:6,background:'#F0EEE9',borderRadius:9999,overflow:'hidden'}}>
              <div style={{width:`${Math.max(4,Math.round(r.value/maxValue*100))}%`,height:'100%',background:'#208D44',borderRadius:9999}}/>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─── Mount ─────────────────────────────────────────────────────── */
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
